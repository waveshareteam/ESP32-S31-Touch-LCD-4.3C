name: Repository Checks

"on":
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_TARGET: esp32s31

jobs:
  repository-checks:
    name: ESP-IDF repository tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Compile Python tooling
        run: python3 -m py_compile scripts/*.py releases/*.py tests/*.py

      - name: Test firmware release gates
        run: python3 -B -m unittest discover -s tests -v

      - name: Validate safe archive names
        run: >-
          python3 -c "from releases.package_firmware import slugify;
          assert slugify('.') == 'firmware';
          assert slugify('..') == 'firmware';
          assert '/' not in slugify('../outside')"

      - name: Discover first-party ESP-IDF projects
        id: discover
        run: |
          python3 scripts/discover_examples.py \
            --target "$EXPECTED_TARGET" \
            --selector all \
            --require-match \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate discovery selectors
        env:
          PROJECT_COUNT: ${{ steps.discover.outputs.count }}
        shell: bash
        run: |
          test "$PROJECT_COUNT" -eq 16
          python3 scripts/discover_examples.py \
            --target "$EXPECTED_TARGET" \
            --selector 11_rgb_lcd \
            --require-match
          python3 scripts/discover_examples.py \
            --target "$EXPECTED_TARGET" \
            --selector examples/esp-idf/11_rgb_lcd \
            --require-match

      - name: Smoke-test ESP-IDF firmware packaging
        env:
          BUILD_DIR: ${{ runner.temp }}/firmware-package-fixture/build
          OUTPUT_DIR: ${{ runner.temp }}/firmware-package-fixture/dist
          PROJECTS_JSON: ${{ steps.discover.outputs.projects }}
        shell: bash
        run: |
          PROJECT_PATH="$(python3 -c 'import json, os; print(json.loads(os.environ["PROJECTS_JSON"])[0]["path"])')"

          python3 - "$BUILD_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          build = Path(sys.argv[1])
          (build / "bootloader").mkdir(parents=True)
          (build / "partition_table").mkdir(parents=True)
          (build / "bootloader" / "bootloader.bin").write_bytes(b"BOOT")
          (build / "partition_table" / "partition-table.bin").write_bytes(b"PART")
          (build / "application.bin").write_bytes(b"APP")
          flasher_args = {
              "flash_files": {
                  "0x2000": "bootloader/bootloader.bin",
                  "0x8000": "partition_table/partition-table.bin",
                  "0x10000": "application.bin",
              },
              "extra_esptool_args": {
                  "chip": "esp32s31",
                  "before": "default_reset",
                  "after": "hard_reset",
              },
              "write_flash_args": [
                  "--flash_mode", "dio", "--flash_freq", "80m", "--flash_size", "16MB"
              ],
          }
          (build / "flasher_args.json").write_text(
              json.dumps(flasher_args), encoding="utf-8"
          )
          PY

          python3 releases/package_firmware.py \
            --project "$PROJECT_PATH" \
            --build-dir "$BUILD_DIR" \
            --name repository-check \
            --framework-version tooling-smoke-test \
            --target "$EXPECTED_TARGET" \
            --git-sha "${{ github.sha }}" \
            --output-dir "$OUTPUT_DIR"

          python3 - "$OUTPUT_DIR" "$EXPECTED_TARGET" <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          archives = list(Path(sys.argv[1]).glob("*.zip"))
          assert len(archives) == 1, archives
          with zipfile.ZipFile(archives[0]) as archive:
              names = set(archive.namelist())
              root = "repository-check/"
              required = {
                  root + "manifest.json",
                  root + "flash.sh",
                  root + "flash.bat",
                  root + "flash_args.txt",
              }
              assert required <= names, required - names
              manifest = json.loads(archive.read(root + "manifest.json"))
              assert manifest["framework"] == "esp-idf"
              assert manifest["target"] == sys.argv[2]
              assert len(manifest["segments"]) == 3
              assert root + manifest["combined_bin"] in names
          PY
